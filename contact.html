<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Get in touch with First Light." />
    <title>Contact · First Light</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#172033; --muted:#647188; --violet:#755cf6; --pink:#f056a7; --line:rgba(23,32,51,.1); }
      * { box-sizing:border-box; }
      body { min-height:100vh; margin:0; color:var(--ink); font-family:Outfit,sans-serif; background:radial-gradient(circle at 90% 14%, rgba(255,166,209,.65), transparent 22rem), radial-gradient(circle at 11% 88%, rgba(93,213,201,.5), transparent 25rem), #f7f7ff; }
      .shell { width:min(1080px,calc(100% - 3rem)); min-height:100vh; margin:auto; display:flex; flex-direction:column; padding:1.65rem 0 2rem; }
      header, footer { display:flex; align-items:center; justify-content:space-between; }
      .brand { display:inline-flex; align-items:center; gap:.65rem; color:var(--ink); font-weight:800; letter-spacing:-.04em; text-decoration:none; }
      .brand-mark { width:2rem; height:2rem; display:grid; place-items:center; border-radius:.65rem; color:#fff; background:linear-gradient(135deg,var(--violet),var(--pink)); box-shadow:0 8px 18px rgba(117,92,246,.3); }
      nav { display:flex; gap:1.1rem; } nav a { color:var(--muted); font-size:.88rem; font-weight:600; text-decoration:none; transition:color .18s ease; } nav a:hover, nav a[aria-current="page"] { color:var(--violet); }
      main { flex:1; display:grid; grid-template-columns:.85fr 1.15fr; gap:4rem; align-items:center; padding:4rem 0; }
      .eyebrow { color:#624bd8; font:.72rem DM Mono,monospace; letter-spacing:.1em; text-transform:uppercase; }
      h1 { max-width:7ch; margin:.8rem 0 1.25rem; font-size:clamp(3.7rem,8vw,6.8rem); line-height:.89; letter-spacing:-.08em; }
      .gradient { background:linear-gradient(100deg,#6045e8,#ec519d 70%,#ee951e); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .lead { max-width:28rem; color:var(--muted); font-size:1.08rem; line-height:1.65; }
      .form-card { padding:2rem; border:1px solid rgba(255,255,255,.8); border-radius:1.4rem; background:rgba(255,255,255,.68); box-shadow:0 24px 55px rgba(61,66,117,.14); backdrop-filter:blur(16px); }
      label { display:block; margin-bottom:.45rem; font-size:.83rem; font-weight:700; }
      input, textarea { width:100%; margin-bottom:1.15rem; padding:.8rem .9rem; border:1px solid var(--line); border-radius:.75rem; outline:none; color:var(--ink); background:rgba(255,255,255,.8); font:inherit; transition:border-color .18s,box-shadow .18s; }
      textarea { min-height:7rem; resize:vertical; } input:focus, textarea:focus { border-color:var(--violet); box-shadow:0 0 0 3px rgba(117,92,246,.14); }
      button { width:100%; padding:.9rem 1rem; border:0; border-radius:.8rem; cursor:pointer; color:#fff; background:var(--ink); box-shadow:0 12px 22px rgba(23,32,51,.18); font:600 .93rem Outfit,sans-serif; transition:transform .18s,box-shadow .18s; } button:hover { transform:translateY(-2px); box-shadow:0 15px 25px rgba(23,32,51,.25); }
      #form-message { min-height:1.2rem; margin:.85rem 0 0; color:#4e3dc5; font-size:.9rem; font-weight:600; text-align:center; }
      footer { color:#7e899c; font:.68rem DM Mono,monospace; }
      @media (max-width:700px) { .shell { width:min(100% - 2rem,1080px); } main { grid-template-columns:1fr; gap:2rem; padding:4rem 0; } h1 { font-size:clamp(3.6rem,18vw,5.5rem); } }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="index.html"><span class="brand-mark">&lt;/&gt;</span> first light</a>
        <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
      </header>
      <main>
        <section>
          <div class="eyebrow">say hello ✦</div>
          <h1>Let’s make<br><span class="gradient">a little magic.</span></h1>
          <p class="lead">Have a bright idea, a question, or simply a good hello? Leave a note and we’ll be delighted to hear from you.</p>
        </section>
        <section class="form-card" aria-label="Contact form">
          <form id="contact-form">
            <label for="name">Your name</label><input id="name" name="name" placeholder="Ada Lovelace" required>
            <label for="email">Email address</label><input id="email" name="email" type="email" placeholder="ada@example.com" required>
            <label for="message">Your message</label><textarea id="message" name="message" placeholder="What’s on your mind?" required></textarea>
            <button type="submit">Send a little note →</button>
            <p id="form-message" role="status" aria-live="polite"></p>
          </form>
        </section>
      </main>
      <footer><span>EST. 2026</span><span>made with ♥ and curiosity</span></footer>
    </div>
    <script>
      document.querySelector('#contact-form').addEventListener('submit', event => {
        event.preventDefault();
        const name = document.querySelector('#name').value.trim() || 'friend';
        document.querySelector('#form-message').textContent = `Thanks, ${name}! Your note is ready to send.`;
        event.currentTarget.reset();
      });
    </script>
  </body>
</html>
